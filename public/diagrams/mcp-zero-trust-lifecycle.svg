  </defs>
  <rect width="800" height="420" rx="14" fill="#090d16" />
  <rect width="800" height="420" rx="14" fill="url(#grid)" />
  <rect x="0.75" y="0.75" width="798.5" height="418.5" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <rect x="24" y="18" width="6" height="34" rx="3" fill="#d92338" />
  <text x="40" y="34" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">Zero Trust 5-Pillar Lifecycle for Autonomous AI Agents</text>
  <text x="40" y="51" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Mapping OWASP Agentic Top 10 (ASI01–ASI10) and OWASP MCP Top 10 controls into production</text>
  <text x="774" y="36" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">CYBERAISECURE.COM</text>

  
  <g>
    <rect x="24" y="120" width="136" height="190" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="24" y="120" width="136" height="4" rx="2" fill="#38bdf8" />
    <rect x="36" y="130" width="90.8" height="16" rx="4" fill="#38bdf8" fill-opacity="0.16" />
           <text x="44" y="141" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">1. IDENTITY</text>
    <text x="92" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Managed NHI</text>
    <text x="92" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Unique agent ID</text>
    <text x="92" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Short-lived OAuth2.1</text>
    <text x="92" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Zero shared PATs</text>
    <text x="92" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Audience scoped</text>
  </g>
  <g>
    <line x1="160" y1="215" x2="178" y2="215" stroke="#38bdf8" stroke-width="2"  marker-end="url(#arrow-38bdf8)" />
    
  </g>
  <g>
    <rect x="178" y="120" width="136" height="190" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5" />
    <rect x="178" y="120" width="136" height="4" rx="2" fill="#34d399" />
    <rect x="190" y="130" width="77.19999999999999" height="16" rx="4" fill="#34d399" fill-opacity="0.16" />
           <text x="198" y="141" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">2. VERIFY</text>
    <text x="246" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Registry &amp; GW</text>
    <text x="246" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Pin tools/list SHA</text>
    <text x="246" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Heuristic scanner</text>
    <text x="246" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Inline MCP Gateway</text>
    <text x="246" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Schema validation</text>
  </g>
  <g>
    <line x1="314" y1="215" x2="332" y2="215" stroke="#34d399" stroke-width="2"  marker-end="url(#arrow-34d399)" />
    
  </g>
  <g>
    <rect x="332" y="120" width="136" height="190" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="332" y="120" width="136" height="4" rx="2" fill="#fbbf24" />
    <rect x="344" y="130" width="77.19999999999999" height="16" rx="4" fill="#fbbf24" fill-opacity="0.16" />
           <text x="352" y="141" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">3. ACCESS</text>
    <text x="400" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Least Agency</text>
    <text x="400" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Rootless container</text>
    <text x="400" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Read-only rootfs</text>
    <text x="400" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Deny egress default</text>
    <text x="400" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Isolate local tools</text>
  </g>
  <g>
    <line x1="468" y1="215" x2="486" y2="215" stroke="#fbbf24" stroke-width="2"  marker-end="url(#arrow-fbbf24)" />
    
  </g>
  <g>
    <rect x="486" y="120" width="136" height="190" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="486" y="120" width="136" height="4" rx="2" fill="#38bdf8" />
    <rect x="498" y="130" width="84" height="16" rx="4" fill="#38bdf8" fill-opacity="0.16" />
           <text x="506" y="141" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">4. MONITOR</text>
    <text x="554" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">AIBOM &amp; Logs</text>
    <text x="554" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Discover shadow MCP</text>
    <text x="554" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Sequence telemetry</text>
    <text x="554" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Token/step breakers</text>
    <text x="554" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Immutable audit</text>
  </g>
  <g>
    <line x1="622" y1="215" x2="640" y2="215" stroke="#d92338" stroke-width="2"  marker-end="url(#arrow-d92338)" />
    
  </g>
  <g>
    <rect x="640" y="120" width="136" height="190" rx="10" fill="#111827" stroke="#d92338" stroke-width="1.5" />
    <rect x="640" y="120" width="136" height="4" rx="2" fill="#d92338" />
    <rect x="652" y="130" width="90.8" height="16" rx="4" fill="#d92338" fill-opacity="0.16" />
           <text x="660" y="141" fill="#d92338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">5. RESPONSE</text>
    <text x="708" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">HITL &amp; Kill</text>
    <text x="708" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Out-of-band consent</text>
    <text x="708" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Raw arg review UI</text>
    <text x="708" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Step-up MFA gate</text>
    <text x="708" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Instant NHI revoke</text>
  </g><text x="400" y="365" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Principle of Least Agency: Bound what an autonomous agent can execute without human sign-off</text>
</svg>
