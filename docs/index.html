    <!-- Immediate Theme Application (Light by default, Prevents FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cas_theme') || localStorage.getItem('thn_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- GitHub Pages Single Page App routing restore -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
