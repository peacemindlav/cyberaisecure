<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Hardened GitHub Actions CI/CD Security Architecture">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
    
    <marker id="arrow-64748b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-38bdf8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-d92338" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d92338" />
    </marker>
    <marker id="arrow-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-fbbf24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#090d16" />
  <rect width="800" height="420" rx="14" fill="url(#grid)" />
  <rect x="0.75" y="0.75" width="798.5" height="418.5" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <rect x="24" y="18" width="6" height="34" rx="3" fill="#d92338" />
  <text x="40" y="34" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">Hardened GitHub Actions CI/CD Security Architecture</text>
  <text x="40" y="51" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Eliminating mutable tag hijacking, excessive permissions, and static cloud secrets</text>
  <text x="774" y="36" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">CYBERAISECURE.COM</text>

  
  <g>
    <rect x="28" y="120" width="155" height="185" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="28" y="120" width="155" height="4" rx="2" fill="#38bdf8" />
    <rect x="40" y="130" width="104.39999999999999" height="16" rx="4" fill="#38bdf8" fill-opacity="0.16" />
           <text x="48" y="141" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">REPO CONTROLS</text>
    <text x="105.5" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Protected Branch</text>
    <text x="105.5" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Signed GPG/SSH</text>
    <text x="105.5" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">2 CODEOWNER reviews</text>
    <text x="105.5" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Fork PR gate enabled</text>
    <text x="105.5" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">No pull_request_target</text>
  </g>
  <g>
    <line x1="183" y1="212" x2="213" y2="212" stroke="#38bdf8" stroke-width="2"  marker-end="url(#arrow-38bdf8)" />
    
  </g>
  <g>
    <rect x="213" y="120" width="175" height="185" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="213" y="120" width="175" height="4" rx="2" fill="#fbbf24" />
    <rect x="225" y="130" width="131.6" height="16" rx="4" fill="#fbbf24" fill-opacity="0.16" />
           <text x="233" y="141" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">WORKFLOW BASELINE</text>
    <text x="300.5" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Zero Default Perms</text>
    <text x="300.5" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">permissions: {} global</text>
    <text x="300.5" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">40-char Commit SHAs</text>
    <text x="300.5" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Dependabot SHA PRs</text>
    <text x="300.5" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">persist-creds: false</text>
  </g>
  <g>
    <line x1="388" y1="212" x2="418" y2="212" stroke="#fbbf24" stroke-width="2"  marker-end="url(#arrow-fbbf24)" />
    
  </g>
  <g>
    <rect x="418" y="120" width="165" height="185" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5" />
    <rect x="418" y="120" width="165" height="4" rx="2" fill="#34d399" />
    <rect x="430" y="130" width="131.6" height="16" rx="4" fill="#34d399" fill-opacity="0.16" />
           <text x="438" y="141" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">JOB 1: SAST AUDIT</text>
    <text x="500.5" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Semgrep &amp; SCA</text>
    <text x="500.5" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">contents: read</text>
    <text x="500.5" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">security-events: write</text>
    <text x="500.5" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Pinned action SHA</text>
    <text x="500.5" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Gate merge on pass</text>
  </g>
  <g>
    <line x1="583" y1="212" x2="613" y2="212" stroke="#34d399" stroke-width="2"  marker-end="url(#arrow-34d399)" />
    <rect x="562" y="195" width="72" height="15" rx="4" fill="#090d16" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
           <text x="598" y="206" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600">OIDC JWT</text>
  </g>
  <g>
    <rect x="613" y="120" width="160" height="185" rx="10" fill="#0f1f1c" stroke="#34d399" stroke-width="1.5" />
    <rect x="613" y="120" width="160" height="4" rx="2" fill="#34d399" />
    <rect x="625" y="130" width="104.39999999999999" height="16" rx="4" fill="#34d399" fill-opacity="0.16" />
           <text x="633" y="141" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">JOB 2: DEPLOY</text>
    <text x="693" y="156" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Ephemeral OIDC</text>
    <text x="693" y="176" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">id-token: write only</text>
    <text x="693" y="192" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Short-lived AWS STS</text>
    <text x="693" y="208" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Zero static IAM keys</text>
    <text x="693" y="224" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Branch-scoped trust</text>
  </g><text x="400" y="365" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Even if a build dependency leaks env vars, ephemeral OIDC tokens expire and cannot pivot</text>
</svg>
