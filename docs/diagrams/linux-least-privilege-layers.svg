<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Linux Defense-in-Depth Least Privilege Layers">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
    
    <marker id="arrow-64748b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-38bdf8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-d92338" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d92338" />
    </marker>
    <marker id="arrow-34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-fbbf24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#090d16" />
  <rect width="800" height="420" rx="14" fill="url(#grid)" />
  <rect x="0.75" y="0.75" width="798.5" height="418.5" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <rect x="24" y="18" width="6" height="34" rx="3" fill="#d92338" />
  <text x="40" y="34" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">Linux Defense-in-Depth Least Privilege Layers</text>
  <text x="40" y="51" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">4 independent kernel &amp; user-space containment barriers against privilege escalation</text>
  <text x="774" y="36" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">CYBERAISECURE.COM</text>

  
  <g>
    <rect x="28" y="118" width="170" height="190" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="28" y="118" width="170" height="4" rx="2" fill="#38bdf8" />
    <rect x="40" y="128" width="97.6" height="16" rx="4" fill="#38bdf8" fill-opacity="0.16" />
           <text x="48" y="139" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">1. PERIMETER</text>
    <text x="113" y="154" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">SSH &amp; Firewall</text>
    <text x="113" y="174" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PermitRootLogin no</text>
    <text x="113" y="190" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Key-only auth</text>
    <text x="113" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">nftables default-deny</text>
    <text x="113" y="222" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Admin ports localhost</text>
  </g>
  <g>
    <line x1="198" y1="213" x2="224" y2="213" stroke="#38bdf8" stroke-width="2"  marker-end="url(#arrow-38bdf8)" />
    
  </g>
  <g>
    <rect x="224" y="118" width="170" height="190" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="224" y="118" width="170" height="4" rx="2" fill="#fbbf24" />
    <rect x="236" y="128" width="104.39999999999999" height="16" rx="4" fill="#fbbf24" fill-opacity="0.16" />
           <text x="244" y="139" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">2. DELEGATION</text>
    <text x="309" y="154" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Hardened visudo</text>
    <text x="309" y="174" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Scoped Cmnd_Alias</text>
    <text x="309" y="190" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Exact binary args</text>
    <text x="309" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Defaults!CMD noexec</text>
    <text x="309" y="222" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Blocks !/bin/sh escape</text>
  </g>
  <g>
    <line x1="394" y1="213" x2="420" y2="213" stroke="#fbbf24" stroke-width="2"  marker-end="url(#arrow-fbbf24)" />
    
  </g>
  <g>
    <rect x="420" y="118" width="170" height="190" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5" />
    <rect x="420" y="118" width="170" height="4" rx="2" fill="#34d399" />
    <rect x="432" y="128" width="138.39999999999998" height="16" rx="4" fill="#34d399" fill-opacity="0.16" />
           <text x="440" y="139" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">3. SERVICE SANDBOX</text>
    <text x="505" y="154" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">systemd Drop-In</text>
    <text x="505" y="174" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">User=www-data</text>
    <text x="505" y="190" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">NoNewPrivileges=yes</text>
    <text x="505" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ProtectSystem=strict</text>
    <text x="505" y="222" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CAP_NET_BIND_SERVICE</text>
  </g>
  <g>
    <line x1="590" y1="213" x2="616" y2="213" stroke="#34d399" stroke-width="2"  marker-end="url(#arrow-34d399)" />
    
  </g>
  <g>
    <rect x="616" y="118" width="156" height="190" rx="10" fill="#111827" stroke="#d92338" stroke-width="1.5" />
    <rect x="616" y="118" width="156" height="4" rx="2" fill="#d92338" />
    <rect x="628" y="128" width="104.39999999999999" height="16" rx="4" fill="#d92338" fill-opacity="0.16" />
           <text x="636" y="139" fill="#d92338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6">4. KERNEL MAC</text>
    <text x="694" y="154" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">SELinux / AppArmor</text>
    <text x="694" y="174" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Confines compromised</text>
    <text x="694" y="190" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">processes at kernel</text>
    <text x="694" y="206" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Blocks /etc/shadow</text>
    <text x="694" y="222" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">even if uid=0</text>
  </g><text x="400" y="366" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">All auth, sudo, and MAC policy denials stream continuously to centralized SIEM</text>
</svg>
